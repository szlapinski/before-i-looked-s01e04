name: Deploy digest preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --lockfile=false

      # The marker lives only in the LANE_MARKER Actions secret; delete it to publish the clean page.
      - name: Test and export the digest
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          PORT: "8787"
        run: |
          pnpm test
          pnpm typecheck
          mkdir -p site
          pnpm start > /tmp/rig.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/digest/2026-10-28 -o site/index.html; then
              break
            fi
            sleep 1
          done

          test -s site/index.html
          if [ -n "$LANE_MARKER" ]; then
            grep -Fq -- "$LANE_MARKER" site/index.html
          else
            grep -Fq "no marker set" site/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
